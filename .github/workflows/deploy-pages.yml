name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies
        run: npm ci
        working-directory: client

      - name: Build Production Client
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || '/api' }}
          CUSTOM_BASE: ${{ secrets.VITE_BASE_PATH }}
        run: |
          if [ -n "$CUSTOM_BASE" ]; then
            export VITE_BASE_PATH="$CUSTOM_BASE"
          elif [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            export VITE_BASE_PATH="/"
          else
            export VITE_BASE_PATH="/${{ github.event.repository.name }}/"
          fi
          echo "Building with VITE_BASE_PATH=$VITE_BASE_PATH and VITE_API_URL=$VITE_API_URL"
          npm run build
        working-directory: client

      - name: Setup SPA 404 Fallback for GitHub Pages
        run: cp client/dist/index.html client/dist/404.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
