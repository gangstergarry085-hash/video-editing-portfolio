[build]
  base = "."
  command = "npm --prefix server install && npm --prefix client install --include=dev && npm --prefix client run build"
  publish = "client/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  included_files = ["server/**"]


# API Redirects (Proxy both /api and /api/* to the serverless function)
[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api/api"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

# SPA fallback — all non-file routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers & Performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
